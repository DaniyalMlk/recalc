name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests on Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor is the one `engines` claims, so the claim is tested rather
        # than asserted. The top is current.
        node-version: ["20.19.0", "22.x", "24.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Test
        run: npm test

  evidence:
    name: The README's figures still hold
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - name: Install
        run: npm ci
      # Recomputes every figure in the "What is checked, and against what"
      # table and exits non-zero if one has moved past what its row claims.
      # The cost rows are counts of cells evaluated rather than timings, so
      # this means the same thing on a runner as it does anywhere else.
      - name: Recompute the evidence table
        run: npm run evidence

  package:
    name: The tarball installs and runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - name: Install
        run: npm ci
      - name: Build the web demo
        # It has its own tsconfig and its own bundler, so it breaks
        # independently of the library.
        run: npm run build:web
      - name: Pack
        run: npm pack
      # The packaging tests assert what the tarball contains. This asserts
      # that installing it works, which is a different question: it exercises
      # module resolution through `exports` and the bin shim, neither of which
      # exists inside the repository.
      - name: Install the tarball into a bare project and use it
        run: |
          mkdir -p /tmp/consumer && cd /tmp/consumer
          npm init -y > /dev/null
          npm install "$GITHUB_WORKSPACE"/recalc-formula-*.tgz
          node --input-type=module -e "
            import * as recalc from 'recalc-formula';
            const names = Object.keys(recalc);
            if (names.length < 50) {
              throw new Error('the package exports ' + names.length + ' names');
            }
            console.log('imported ' + names.length + ' exports');
          "
          printf 'A1 = 6\nA2 = 7\nB1 = =A1*A2\nB1\n' \
            | ./node_modules/.bin/recalc | tee /tmp/out.txt
          grep -q '42' /tmp/out.txt
          echo "the installed package imports and evaluates"
